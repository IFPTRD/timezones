<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Time Zones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title" data-i18n="title">Canadian Time Zones</h1>
      <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
        <span data-i18n="langSwitch">Français</span>
      </button>
    </header>

    <section class="date-selector">
      <div class="selector-group">
        <label data-i18n="checkDate">Check time for:</label>
        <button class="btn-now" id="nowBtn" data-i18n="now">Now</button>
      </div>
      <div class="date-time-inputs">
        <input type="date" id="dateInput" class="date-input">
        <div class="time-input-group">
          <input type="number" id="hourInput" class="time-input" min="1" max="12" placeholder="12">
          <span class="time-separator">:</span>
          <input type="number" id="minuteInput" class="time-input" min="0" max="59" placeholder="00">
          <select id="ampmInput" class="ampm-input">
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>
        </div>
      </div>
    </section>

    <div class="time-comparison" id="timeComparison">
      <!-- Time difference summary will be inserted here -->
    </div>

    <div class="grid" id="timeGrid">
      <!-- Time cards will be inserted here -->
    </div>

    <footer class="info-panel">
      <h2 data-i18n="dstNotice">Daylight Saving Time Changes in 2027</h2>
      <div class="info-content">
        <div class="info-item">
          <strong data-i18n="dstStart">Starts:</strong>
          <span data-i18n="dstStartDate">March 14, 2:00 AM (clocks forward)</span>
        </div>
        <div class="info-item">
          <strong data-i18n="dstEnd">Ends:</strong>
          <span data-i18n="dstEndDate">November 7, 2:00 AM (clocks back)</span>
        </div>
      </div>
      <p class="info-note" data-i18n="noChanges">
        <strong>No clock changes:</strong> BC, Manitoba, Yukon, Saskatchewan (permanent daylight time)
      </p>
      <p class="info-note info-recent" data-i18n="recentChanges">
        2026 changes: BC and Manitoba moved to permanent daylight time
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>

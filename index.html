<!doctype html>
<html lang="en-CA">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compare Canadian capital-city times with Ottawa. Plan meetings and understand the November 2026 clock change. English / Français."><title>Canada, at the same time</title><link rel="stylesheet" href="style.css"><script defer src="time.js"></script><script defer src="script.js"></script></head>
<body>
<div class="notice" id="notice"></div>
<main>
<header><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="subtitle" class="muted"></p></div><button id="language" lang="fr-CA">Français</button></header>
<section class="planner" aria-labelledby="plannerTitle">
<div class="anchor"><p class="eyebrow" id="plannerTitle"></p><h2>Ottawa</h2><output id="anchorTime"></output><p id="anchorDate"></p><span id="anchorZone" class="tag"></span><p id="mode" class="muted"></p><button id="now"></button></div>
<div class="controls"><div class="calendar"><div class="month-nav"><button id="prevMonth">←</button><h3 id="month"></h3><button id="nextMonth">→</button></div><div id="weekdays" class="calendar-grid"></div><div id="days" class="calendar-grid"></div></div>
<div class="time-controls"><div class="control-heading"><label for="slider" id="sliderLabel"></label><button id="format"></button></div><input id="slider" type="range" min="0" max="1439" step="1"><div class="scale"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span></div><div class="presets" id="presets"></div><div class="exact"><label for="hour" id="exactLabel"></label><input id="hour" type="number" min="0" max="23"><span>:</span><input id="minute" type="number" min="0" max="59"><span class="muted">24 h</span></div><p id="timeError" role="status"></p><div id="fold" hidden><button id="first"></button><button id="second"></button></div></div></div>
</section>
<section class="transition" aria-labelledby="transitionTitle"><div><h2 id="transitionTitle"></h2><p id="transitionText"></p></div><div class="periods"><button id="before"></button><button id="after"></button></div></section>
<section aria-labelledby="resultsTitle"><div class="results-heading"><div><h2 id="resultsTitle"></h2><p id="resultsHelp" class="muted"></p></div><button id="copy"></button></div><div id="groups"></div><p id="legend" class="muted"></p><p id="copyStatus" role="status"></p></section>
<section class="comparison"><h2 id="compareTitle"></h2><p id="compareHelp" class="muted"></p><div class="table-scroll"><table><thead id="compareHead"></thead><tbody id="compareBody"></tbody></table></div></section>
<footer><p id="scope"></p><p id="verified"></p><nav id="sources"></nav><p><a href="https://github.com/IFPTRD/timezones">GitHub</a> · <a href="SOURCES.md" id="method"></a></p></footer>
</main><noscript>This tool requires JavaScript. / Cet outil nécessite JavaScript.</noscript>
</body></html>

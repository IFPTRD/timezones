<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Time Zones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title" data-i18n="title">Canadian Time Zones</h1>
      <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
        <span data-i18n="langSwitch">Français</span>
      </button>
    </header>

    <section class="date-selector">
      <label for="dateInput" data-i18n="checkDate">Check time for:</label>
      <input type="datetime-local" id="dateInput" class="date-input">
      <button class="btn-secondary" id="nowBtn" data-i18n="now">Now</button>
    </section>

    <div class="grid" id="timeGrid">
      <!-- Time cards will be inserted here -->
    </div>

    <footer class="info-panel">
      <h2 data-i18n="dstNotice">Daylight Saving Time Changes in 2025</h2>
      <div class="info-content">
        <div class="info-item">
          <strong data-i18n="dstStart">Starts:</strong>
          <span data-i18n="dstStartDate">March 9, 2:00 AM (clocks forward)</span>
        </div>
        <div class="info-item">
          <strong data-i18n="dstEnd">Ends:</strong>
          <span data-i18n="dstEndDate">November 2, 2:00 AM (clocks back)</span>
        </div>
      </div>
      <p class="info-note" data-i18n="noChanges">
        <strong>No clock changes:</strong> Yukon (stays UTC-7), Saskatchewan (stays UTC-6)
      </p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canadian Time Zones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="header-content">
        <h1 class="title" data-i18n="title">Canadian Time Zones</h1>
        <p class="subtitle" data-i18n="subtitle">Understanding time across Canada</p>
      </div>
      <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
        <span data-i18n="langSwitch">FR</span>
      </button>
    </header>

    <section class="time-selector">
      <div class="current-time">
        <div class="location-label" data-i18n="viewingFrom">Viewing from Ottawa</div>
        <div class="time-display" id="ottawaTime">2:30 PM</div>
        <div class="date-display" id="ottawaDate">Thursday, October 22, 2026</div>
      </div>
      <div class="time-controls">
        <button class="control-btn" id="nowBtn" data-i18n="now">Now</button>
        <input type="date" id="dateInput" class="control-input">
        <input type="time" id="timeInput" class="control-input">
      </div>
    </section>

    <section class="timeline-section">
      <div class="timeline-header" data-i18n="timelineHeader">At the same moment across Canada:</div>
      <div class="timeline" id="timeline">
        <!-- Timeline will be generated here -->
      </div>
    </section>

    <footer class="info-panel">
      <div class="info-grid">
        <div class="info-block">
          <h3 data-i18n="dstTitle">Daylight Saving 2027</h3>
          <p data-i18n="dstDates">Mar 14 – Nov 7</p>
          <p class="info-detail" data-i18n="dstWho">ON, QC, NS, NB, PE, NL, NU, NT, AB</p>
        </div>
        <div class="info-block">
          <h3 data-i18n="permanentTitle">Permanent Time</h3>
          <p data-i18n="permanentWho">BC, MB, YT, SK</p>
          <p class="info-detail" data-i18n="permanentNote">No clock changes</p>
        </div>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
